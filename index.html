    <!--
      Fondo vino del splash mientras carga la app (solo en la app instalada o en la vista previa):
      así no se ve un destello beige antes de la animación. Splash.tsx lo quita al montarse.
    -->
    <div id="boot-splash" style="position: fixed; inset: 0; z-index: 999; background: #6d0d1d"></div>
    <script>
      (function () {
        var installed =
          window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        var preview = false;
        try {
          preview = new URLSearchParams(location.search).get("vista") === "app" || localStorage.getItem("ora.previewInBrowser") === "1";
          if (new URLSearchParams(location.search).get("vista") === "instructivo") preview = false;
        } catch (e) {}
        if (!installed && !preview) document.getElementById("boot-splash").remove();
      })();
    </script>
